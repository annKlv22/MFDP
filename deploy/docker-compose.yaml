name: bird-id

services:
  db:
    image: postgres:16-alpine
    container_name: bird-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-birduser}
      POSTGRES_PASSWORD: ${DB_PASS:-birdpass}
      POSTGRES_DB: ${DB_NAME:-birds}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-birduser} -d ${DB_NAME:-birds}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [bird-net]

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: bird-rabbitmq
    hostname: bird-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-rmuser}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-rmpassword}
    ports:
      - "15672:15672"   # веб-консоль RabbitMQ (наблюдать очередь и воркеров)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks: [bird-net]

  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    image: bird-id-api:latest
    container_name: bird-api
    restart: unless-stopped
    env_file: [.env]
    volumes:
      - uploads:/data/uploads
    depends_on:
      db: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks: [bird-net]

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    image: bird-id-worker:latest
    # БЕЗ container_name — иначе невозможно масштабирование (конфликт имён).
    restart: unless-stopped
    env_file: [.env]
    volumes:
      - uploads:/data/uploads
      - hf_cache:/cache/hf
    depends_on:
      db: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    networks: [bird-net]
    

  web:
    image: nginx:1.27-alpine
    container_name: bird-web
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app: {condition: service_healthy}
    networks: [bird-net]

networks:
  bird-net:
    driver: bridge

# Именованные тома: кроссплатформенно, без привязки к диску/букве — работает на Windows/Mac/Linux.
# Данные переживают `docker compose down` (стираются только при `down -v`).
# Чтобы все тома физически лежали на диске D: Docker Desktop → Settings → Resources → Advanced →
# Disk image location → D:\DockerData (туда уедут и образы, и тома).
volumes:
  postgres_data:
  rabbitmq_data:
  uploads:
  hf_cache:
